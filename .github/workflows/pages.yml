name: Publish Sharifa preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sharifa-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify-pages-preview.mjs
      - run: node scripts/verify-rankings.mjs
      - run: node scripts/verify-person-search.mjs
      - run: node scripts/verify-attention.mjs
      - run: node node_modules/vite/bin/vite.js build --config vite.pages.config.ts
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
